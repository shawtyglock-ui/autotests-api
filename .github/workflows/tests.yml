# Имя вашего workflow, которое будет отображаться в интерфейсе GitHub Actions
name: API tests

# Указываем, когда будет запускаться данный workflow
on:
  push:
    branches:
      - main  # Запускать workflow, когда будет сделан коммит в ветку main
  pull_request:
    branches:
      - main  # Запускать workflow, когда будет сделан pull request в ветку main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    env:
      APP_HOST: "http://localhost:8000"
      DATABASE_URL: "sqlite+aiosqlite:///./local.db"
      JWT_ALGORITHM: "HS256"
      JWT_SECRET_KEY: "qa-automation-engineer-api-course-secret-key"
      JWT_ACCESS_TOKEN_EXPIRE: 1800
      JWT_REFRESH_TOKEN_EXPIRE: 5184000

    steps:
      # 1. Клонирование репозитория с тестами
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Установка Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Клонирование репозитория с тестовым сервером
      - name: Clone test server repository
        run: git clone https://github.com/Nikita-Filonov/qa-automation-engineer-api-course.git

      # 4. Установка зависимостей тестового сервера
      - name: Install test server dependencies
        run: |
          pip install -r qa-automation-engineer-api-course/requirements.txt
          pip install uvicorn

      # 5. Запуск тестового сервера
      - name: Start a test server
        run: |
          nohup bash -c 'cd qa-automation-engineer-api-course && python -m uvicorn main:app --host 0.0.0.0 --port 8000' > /tmp/uvicorn.log 2>&1 &
          echo "Server started with PID $!"

      # 6. Установка зависимостей проекта
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7. Ожидание готовности сервера
      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/api/v1/users > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i: server not ready yet, waiting..."
            sleep 1
          done
          echo "Server failed to start. Logs:"
          cat /tmp/uvicorn.log
          exit 1

      # 8. Запуск тестов
      - name: Run API tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2 --ignore=qa-automation-engineer-api-course

      # 9. Сохранение результатов Allure как артефакт
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  publish-report:
    runs-on: ubuntu-latest
    needs: run-tests
    if: always()

    steps:
      # 1. Скачивание результатов тестов из артефактов
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # 2. Получение истории отчётов Allure из ветки gh-pages
      - name: Get Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 3. Генерация отчёта Allure
      - name: Generate Allure Report
        run: |
          wget -qO allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
          allure generate allure-results --clean -o allure-history

      # 4. Деплой отчёта на GitHub Pages
      - name: Deploy report to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
